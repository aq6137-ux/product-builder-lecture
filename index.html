<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottery Number Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <button id="theme-toggle">Dark Mode</button>
  <h1>Lotto Number Generator</h1>
  <div id="lottery-numbers">
    <!-- Lottery numbers will be displayed here -->
  </div>
  <button id="draw-button">Draw Numbers</button>

  <section id="affiliate-inquiry">
    <h2>제휴 문의</h2>
    <form action="https://formspree.io/f/mvzyndqv" method="POST">
      <div class="form-group">
        <label for="name">성함/업체명</label>
        <input type="text" id="name" name="name" required placeholder="성함 또는 업체명을 입력해주세요">
      </div>
      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label for="subject">제목</label>
        <input type="text" id="subject" name="subject" required placeholder="문의 제목을 입력해주세요">
      </div>
      <div class="form-group">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" required placeholder="문의하실 내용을 상세히 적어주세요"></textarea>
      </div>
      <button type="submit" id="submit-button">문의하기</button>
    </form>
  </section>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
